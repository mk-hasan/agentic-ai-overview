[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "agentic-ai-overview"
version = "0.1.0"
description = "Agentic AI design patterns with runnable LangGraph examples"
readme = "README.md"
license = { text = "GPL-3.0-or-later" }
requires-python = ">=3.9"
authors = [{ name = "Agentic AI Overview contributors" }]
keywords = ["agentic-ai", "langgraph", "langchain", "agents", "patterns"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: GNU General Public License v3 or later (GPLv3+)",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "langgraph>=0.2.0",
    "langchain-core>=0.3.0",
    "langchain-openai>=0.2.0",
    "python-dotenv>=1.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "langgraph-checkpoint-sqlite>=2.0.0",
]
ml = [
    "mlflow>=2.10.0",
]
mcp = [
    "mcp>=1.2.0; python_version >= '3.10'",
    "langchain-mcp-adapters>=0.1.0; python_version >= '3.10'",
]

[project.urls]
Documentation = "https://github.com/mk-hasan/agentic-ai-overview#readme"
Source = "https://github.com/mk-hasan/agentic-ai-overview"

[tool.setuptools.packages.find]
where = ["."]
include = ["shared*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
